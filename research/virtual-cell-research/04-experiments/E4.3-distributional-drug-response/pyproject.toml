[project]
name = "flowpert-mini"
version = "0.1.0"
description = "A minimal, educational distributional drug-response model: conditional flow matching vs CVAE vs mean predictors on sci-Plex3 (E4.3)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pyarrow>=15",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "pot>=0.9.4",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
