[project]
name = "glyph-mini"
version = "0.1.0"
description = "A minimal, educational re-implementation of Glyph: Matryoshka Top-K SAE over frozen embeddings, concept-outcome association study, cross-site replication and DML confounder adjustment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=9.2.0"]
