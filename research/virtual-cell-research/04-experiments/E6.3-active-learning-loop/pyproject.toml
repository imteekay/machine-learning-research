[project]
name = "loop-mini"
version = "0.1.0"
description = "A minimal, educational closed-loop experiment selector: active learning on a Perturb-seq screen (retrospective simulation, E6.3)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "anndata>=0.10",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
