[project]
name = "scvi-mini"
version = "0.1.0"
description = "A minimal, educational scVI: which likelihood (Poisson, NB, ZINB, Gaussian-on-log) fits 10x UMI counts? (E0.1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "torch>=2.4",
]

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
