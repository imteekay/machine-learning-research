[project]
name = "get-mini"
version = "0.1.0"
description = "A minimal, educational GET-style model: region tokens (peak accessibility + distance) around each gene's TSS -> attention pooling -> expression, with RNA-only, gene-activity and shuffled-peak controls (E3.1)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py>=3.12",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.5",
]

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
