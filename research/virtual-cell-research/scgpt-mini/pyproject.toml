[project]
name = "scgpt-mini"
version = "0.1.0"
description = "A minimal, educational scGPT: gene-token + binned-value embeddings, masked expression pretraining, frozen <cls> embeddings vs HVG+PCA for cell-type annotation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "scanpy",
    "scikit-learn",
    "torch",
]

[build-system]
requires = ["uv_build>=0.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest"]
